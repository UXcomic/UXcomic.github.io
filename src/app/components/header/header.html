<header>
  <div *ngIf="!!category" (click)="openDialog()" class="ux__category-container h-[44px] flex items-center gap-[8px]">
    <span class="ux__category-icon">{{category.icon}}</span>
    <span class="ux__category-name">{{category.name}}</span>
    <mat-icon fontIcon="keyboard_arrow_down"></mat-icon>
  </div>
</header>

@if (loading) {
  <div class="notion-embed notion-embed--loading">
    <div class="notion-embed__spinner"></div>
  </div>
} @else if (error) {
  <div class="notion-embed notion-embed--error">
    <p>Không thể tải nội dung.</p>
  </div>
} @else if (embedHtml) {
  <div class="notion-embed">
    <iframe [srcdoc]="embedHtml" title="Embedded content"></iframe>
  </div>
}

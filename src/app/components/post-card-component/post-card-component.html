<div
  *ngIf="!!post"
  (click)="goToPostDetail()"
  class="post-card__container h-full p-[4px] bg-white rounded-[6px]"
  [class.rotate-[4deg]]="rotate"
  [class.post-card__container--sm]="small"
>
  <div class="post-card__content h-full border-[0.5px] rounded-[2px]">
    <img [src]="`${config.baseUrl}${post.cover}`" [alt]="post.title" />
    <div class="py-[16px] px-[8px] relative">
      <div
        *ngIf="post.level"
        class="post-card__level bg-white inline-flex items-center justify-center h-[24px] absolute top-[-12px] left-[50%] translate-x-[-50%] px-[8px] py-[2px] border-[0.58px] rounded-full"
      >
        <span *ngFor="let num of [].constructor(post.level.length); let i = index" class="text-[10px]">
          {{post.level.icon}}
        </span>
        <span *ngFor="let num of [].constructor(3 - post.level.length); let i = index" class="text-[10px] opacity-30">
          {{post.level.icon}}
        </span>
      </div>
      <h4 class="post-card__title text-[12px] text-center">{{post.title}}</h4>
    </div>
  </div>
</div>

<section *ngIf="!!postContent" class="pb-[12px]">
  <div *ngIf="!hideTitle" class="pt-[24px] pb-[16px] text-center">
    <h5 class="post-content__title">{{postContent.title}}</h5>
    <p class="post-content__created-date">{{postContent.createdDate | date:'longDate'}}</p>
  </div>
  <article class="px-[16px] overflow-x-hidden">
    <app-post-content-detail-section [content]="postContent.content"></app-post-content-detail-section>
  </article>
  <div
    class="post-content-detail__relevant-items overflow-x-auto px-[16px] pt-[8px] pb-[32px] mb-[8px] flex flex-nowrap gap-x-[16px]"
  >
    @for(p of relevantPosts; track $index) {
    <app-post-card-component [post]="p" class="w-[160px] h-[216px] shrink-0"></app-post-card-component>
    }
  </div>
  <div
    class="post-content__action-bar w-[240px] h-[48px] bg-white/80 border-[2px] border-white rounded-full mx-auto flex justify-between items-center sticky bottom-[10px] backdrop-blur-[16px]"
  >
    <span class="w-[80px] h-[48px] flex items-center justify-center">
      <svg
        class="w-6 h-6"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M7 11c.889-.086 1.416-.543 2.156-1.057a22.323 22.323 0 0 0 3.958-5.084 1.6 1.6 0 0 1 .582-.628 1.549 1.549 0 0 1 1.466-.087c.205.095.388.233.537.406a1.64 1.64 0 0 1 .384 1.279l-1.388 4.114M7 11H4v6.5A1.5 1.5 0 0 0 5.5 19v0A1.5 1.5 0 0 0 7 17.5V11Zm6.5-1h4.915c.286 0 .372.014.626.15.254.135.472.332.637.572a1.874 1.874 0 0 1 .215 1.673l-2.098 6.4C17.538 19.52 17.368 20 16.12 20c-2.303 0-4.79-.943-6.67-1.475"
        />
      </svg>
    </span>
    <span (click)="sharePost()" class="w-[80px] h-[48px] flex items-center justify-center">
      <svg
        class="w-6 h-6"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-width="2"
          d="M7.926 10.898 15 7.727m-7.074 5.39L15 16.29M8 12a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Zm12 5.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Zm0-11a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0Z"
        />
      </svg>
    </span>
    <span class="w-[80px] h-[48px] flex items-center justify-center">
      <svg
        class="w-6 h-6"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M17 13c-.889.086-1.416.543-2.156 1.057a22.322 22.322 0 0 0-3.958 5.084 1.6 1.6 0 0 1-.582.628 1.549 1.549 0 0 1-1.466.087 1.587 1.587 0 0 1-.537-.406 1.666 1.666 0 0 1-.384-1.279l1.389-4.114M17 13h3V6.5A1.5 1.5 0 0 0 18.5 5v0A1.5 1.5 0 0 0 17 6.5V13Zm-6.5 1H5.585c-.286 0-.372-.014-.626-.15a1.797 1.797 0 0 1-.637-.572 1.873 1.873 0 0 1-.215-1.673l2.098-6.4C6.462 4.48 6.632 4 7.88 4c2.302 0 4.79.943 6.67 1.475"
        />
      </svg>
    </span>
  </div>
</section>
